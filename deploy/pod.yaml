apiVersion: v1
kind: Pod
metadata:
  name: rudder
  namespace: default
  annotations:
    k8s.v1.cni.cncf.io/networks: |
      [
        {"name": "rudder-net1", "interface": "eth1"},
        {"name": "rudder-net2", "interface": "eth2"},
        {"name": "rudder-net3", "interface": "eth3"}
      ]
spec:
  # The sample pod uses Multus interfaces instead of hostNetwork so labs can
  # model multiple ingress/egress links without moving the whole pod into the
  # host network namespace.
  hostNetwork: false
  containers:
    - name: rudder
      image: rudder:latest
      imagePullPolicy: Never
      stdin: true
      tty: true
      securityContext:
        # eBPF program loading and TC attachment require elevated privileges in
        # this lab manifest. A hardened production deployment should replace
        # this with the narrowest capabilities and host mounts that still work.
        privileged: true
      volumeMounts:
        - name: bpf-fs
          mountPath: /sys/fs/bpf
        - name: lib-modules
          mountPath: /lib/modules
          readOnly: true
        - name: usr-src
          mountPath: /usr/src
          readOnly: true
  volumes:
    - name: bpf-fs
      hostPath:
        # Shared eBPF pinning location used by bpftool and the Rudder daemon.
        path: /sys/fs/bpf
        type: Directory
    - name: lib-modules
      hostPath:
        path: /lib/modules
        type: Directory
    - name: usr-src
      hostPath:
        path: /usr/src
        type: Directory
