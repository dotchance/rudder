name: Feature request
description: Suggest an enhancement for rudder.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What networking or operations problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, CLI, rule format, or deployment change you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing tools, workarounds, or other designs you considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Topology, traffic type, Kubernetes details, or constraints.
